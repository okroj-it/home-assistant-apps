name: doorkey
version: "0.1.0"
slug: doorkey
description: Phone keypad for the front door from an NFC tap, and fingerprint-confirmed actions
url: https://github.com/okroj-it/doorkey
arch:
  - aarch64
  - amd64
# Prebuilt multi-arch image, tagged with the version above.
image: ghcr.io/okroj-it/doorkey-app
init: true
startup: application
boot: auto

# The keypad and tap pages: publish this port over HTTPS under `origin`
# (Cloudflared app, or a reverse proxy). The admin page is never on it.
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: Keypad and tap pages (put HTTPS in front)

# The admin page, in the sidebar, behind Home Assistant's login. doorkey
# itself lets in only Home Assistant administrators.
ingress: true
ingress_port: 8099
panel_icon: mdi:door
panel_title: doorkey
panel_admin: true

homeassistant_api: true
services:
  - mqtt:want

watchdog: http://[HOST]:[PORT:8080]/healthz
backup: hot
backup_pre: doorkey db:checkpoint

options:
  origin: ""
  lock_entity: ""
  tap_mode: sun
  home_cidrs: []
  admin_users: []
schema:
  origin: url
  lock_entity: match(^lock\.[a-z0-9_]+$)
  notify_service: str?
  tap_mode: list(sun|static)
  static_path: password?
  tag_kek: password?
  tag_meta_key: password?
  home_cidrs:
    - str
  admin_users:
    - str
